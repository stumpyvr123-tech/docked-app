<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docked | Home</title>
</head>

<body>
    <style>
        body {
            font-family: arial;
            text-align: center;
        }

        .button {
            position: relative;
            width: 150px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border: 1px solid #17795E;
            background-color: #209978;
            overflow: hidden;
        }

        .button,
        .button__icon,
        .button__text {
            transition: all 0.3s;
        }

        .button .button__text {
            transform: translateX(22px);
            color: #fff;
            font-weight: 600;
        }

        .button .button__icon {
            position: absolute;
            transform: translateX(109px);
            height: 100%;
            width: 39px;
            background-color: #17795E;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button .svg {
            width: 20px;
            fill: #fff;
        }

        .button:hover {
            background: #17795E;
        }

        .button:hover .button__text {
            color: transparent;
        }

        .button:hover .button__icon {
            width: 148px;
            transform: translateX(0);
        }

        .button:active .button__icon {
            background-color: #146c54;
        }

        .button:active {
            border: 1px solid #146c54;
        }

        .text-container {
            text-align: center;
            /* Centers the button horizontally */
        }

        .center-wrapper {
            display: grid;
            place-items: center;
            /* Centers perfectly horizontally and vertically */

            /* Forces container to take the full screen height */
            width: 100%;
            /* Forces container to take full width */
        }

        .button-link {
            text-decoration: none;
            color: rgb(239, 236, 236);
            background-color: blue;
            border: 1px solid black;
            padding: 10px 20px;
            border-radius: 5px;

        }

        .button-link:hover {
            background-color: darkblue;
            border: 1px solid black;
            padding: 10px 20px;
            border-radius: 5px;
            color: rgb(253, 253, 253);
            text-decoration: none;
        }
    </style>


    <h1>Docked | App</h1>
    <h2>Docked: Widgets that enhance your experience.</h2>
    <p>Perfect for the desktop while working!</p>
    <div class="center-wrapper">

        <a href="download.html">
            <button class="button-link">Downloads</button>
        </a>

        <a href="docs.html">
            <button class="button-link">Read the Docs</button>
        </a>
    </div>

</body>

</html>
