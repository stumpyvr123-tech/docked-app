    <style>
        body {
            font-family: arial;
            text-align: center;
        }

        .button {
            position: relative;
            width: 150px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border: 1px solid #17795E;
            background-color: #209978;
            overflow: hidden;
        }

        .button,
        .button__icon,
        .button__text {
            transition: all 0.3s;
        }

        .button .button__text {
            transform: translateX(22px);
            color: #fff;
            font-weight: 600;
        }

        .button .button__icon {
            position: absolute;
            transform: translateX(109px);
            height: 100%;
            width: 39px;
            background-color: #17795E;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button .svg {
            width: 20px;
            fill: #fff;
        }

        .button:hover {
            background: #17795E;
        }

        .button:hover .button__text {
            color: transparent;
        }

        .button:hover .button__icon {
            width: 148px;
            transform: translateX(0);
        }

        .button:active .button__icon {
            background-color: #146c54;
        }

        .button:active {
            border: 1px solid #146c54;
        }

        .text-container {
            text-align: center;
            /* Centers the button horizontally */
        }

        .center-wrapper {
            display: grid;
            place-items: center;
            /* Centers perfectly horizontally and vertically */

            /* Forces container to take the full screen height */
            width: 100%;
            /* Forces container to take full width */
        }

        /* Your existing wrapper (without min-height, as requested!) */
        .center-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            /* Adds space between the two buttons */
            flex-wrap: wrap;
            /* Allows them to stack on mobile screens safely */
            width: 100%;
        }

        /* Base style for both buttons */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            /* Space between the logo icon and text */
            padding: 12px 24px;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        /* Specific styling for Mac button */
        .mac-btn {
            background-color: #222222;
        }

        .mac-btn:hover {
            background-color: #444444;
        }

        /* Specific styling for Windows button */
        .windows-btn {
            background-color: #0078d4;
        }

        .windows-btn:hover {
            background-color: #106ebe;
        }

        /* Size for the platform icons inside the buttons */
        .icon {
            width: 20px;
            height: 20px;
        }

        /* Small click animation effect */
        .download-btn:active {
            transform: scale(0.98);
        }

        button {
            display: flex;
            height: 3em;
            width: 100px;
            align-items: center;
            justify-content: center;
            background-color: #eeeeee4b;
            border-radius: 3px;
            letter-spacing: 1px;
            transition: all 0.2s linear;
            cursor: pointer;
            border: none;
            background: #00aaf9;
        }

        button>svg {
            margin-right: 5px;
            margin-left: 5px;
            font-size: 20px;
            transition: all 0.4s ease-in;
        }

        button:hover>svg {
            font-size: 1.2em;
            transform: translateX(-5px);
        }

        button:hover {
            box-shadow: 9px 9px 33px #d1d1d1, -9px -9px 33px #ffffff;
            transform: translateY(-2px);
        }
    </style>
