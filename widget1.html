<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>loading</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .tip-container {
            position: relative;
            text-align: center;
            max-width: 400px;
            padding: 20px;
            width: 100%;
        }

        /* Base style for all tips */
        .tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            opacity: 0;
            animation: showTip 500ms infinite;
        }






        @keyframes showTip {
            0% {
                opacity: 1;
                z-index: 2;
            }


        }
    </style>
</head>

<body style="text-align: center;">

    <div class="tip-container">

        <h1 style="margin-top: 250px;">getting time in your local time zone</h1>
        <div class="loader">
            <div class="justify-content-center jimu-primary-loading"></div>
        </div>


        <style>
            /* From Uiverse.io by Donewenfu */
            .loader {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
            }

            .jimu-primary-loading:before,
            .jimu-primary-loading:after {
                position: absolute;
                top: 0;
                content: '';
            }

            .jimu-primary-loading:before {
                left: -19.992px;
            }

            .jimu-primary-loading:after {
                left: 19.992px;
                -webkit-animation-delay: 0.32s !important;
                animation-delay: 0.32s !important;
            }

            .jimu-primary-loading:before,
            .jimu-primary-loading:after,
            .jimu-primary-loading {
                background: #076fe5;
                -webkit-animation: loading-keys-app-loading 0.8s infinite ease-in-out;
                animation: loading-keys-app-loading 0.8s infinite ease-in-out;
                width: 13.6px;
                height: 32px;
            }

            .jimu-primary-loading {
                text-indent: -9999em;
                margin: auto;
                position: absolute;
                right: calc(50% - 6.8px);
                top: calc(50% - 16px);
                -webkit-animation-delay: 0.16s !important;
                animation-delay: 0.16s !important;
            }

            @-webkit-keyframes loading-keys-app-loading {

                0%,
                80%,
                100% {
                    opacity: .75;
                    box-shadow: 0 0 #076fe5;
                    height: 32px;
                }

                40% {
                    opacity: 1;
                    box-shadow: 0 -8px #076fe5;
                    height: 40px;
                }
            }

            @keyframes loading-keys-app-loading {

                0%,
                80%,
                100% {
                    opacity: .75;
                    box-shadow: 0 0 #076fe5;
                    height: 32px;
                }

                40% {
                    opacity: 1;
                    box-shadow: 0 -8px #076fe5;
                    height: 40px;
                }
            }
        </style>

        <script>
            setTimeout(() => {
                window.location.href = "l2.html";
            }, 1000);
        </script>
</body>

</html>
