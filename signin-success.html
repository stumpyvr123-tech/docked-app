<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing in | Docked</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script defer src="firebase-config.js"></script>
    <script defer src="app-auth.js"></script>
    <script defer src="signin-success.js"></script>
</head>

<body class="auth-page signin-success-page">
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="success-title">
            <p class="auth-eyebrow">DOCKED ACCOUNT</p>
            <h1 id="success-title">Connecting to Firebase…</h1>
            <p class="success-copy" id="success-copy">Finishing your Google sign-in.</p>
            <p class="auth-message" id="success-status" role="status" aria-live="polite" aria-busy="true">
                <span class="auth-loader" id="success-loader" aria-hidden="true">
                    <span></span><span></span><span></span>
                </span>
                <span id="success-status-text">Connecting to Firebase…</span>
            </p>
            <button type="button" class="success-continue" id="continue-to-account" disabled hidden>Continue to account</button>
        </section>
    </main>
</body>

</html>
